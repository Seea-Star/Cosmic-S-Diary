<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - My Diary</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Nanum+Pen+Script&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111111;
      color: #111111;
      font-family: 'Indie Flower', 'Nanum Pen Script', cursive;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Main layout container */
    .layout-container {
      max-width: 950px;
      width: 100%;
      display: grid;
      grid-template-columns: 2.2fr 0.8fr;
      gap: 20px;
      align-items: start;
    }

    /* DIARY COVER / HEADER IMAGE AREA */
    .diary-cover-container {
      grid-column: 1 / -1;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .diary-cover-img {
      max-width: 100%;
      width: 450px;
      height: auto;
      display: block;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    /* MOBILE MENU TOGGLE CONTAINER */
    .mobile-header-bar {
      display: none;
      grid-column: 1 / -1;
      justify-content: flex-end;
      margin-bottom: 5px;
    }

    /* LEFT SECTION: DIARY PAGE (SOLO IL POST DI BENVENUTO) */
    .diary-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .diary-entry {
      background-color: #F3EEDA;
      background-image: linear-gradient(rgba(180, 170, 150, 0.4) 1px, transparent 1px);
      background-size: 100% 32px;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 6px 6px 0px #111111;
      line-height: 32px;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      line-height: 1;
    }

    .entry-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #111111;
    }

    .entry-date {
      background: #111111;
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 12px;
      border: 2px solid #111111;
      box-shadow: 2px 2px 0px #F3EEDA;
    }

    .entry-content {
      font-size: 1.35rem;
      color: #111111;
    }

    /* Sticker style image */
    .sticker-img {
      max-width: 80%;
      height: auto;
      display: block;
      margin: 20px auto;
      border: none;
      box-shadow: none;
      background: transparent;
      filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.15));
    }

    /* RIGHT SECTION: SIDEBAR */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-box {
      background: #F3EEDA;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 4px 4px 0px #111111;
